[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "kap-client"
dynamic = ["version"]
description = "Fetch company and fund disclosures from https://www.kap.org.tr"
readme = "README.md"
authors = [{ name = "Serhat Mutlu Durmaz", email = "serhat.md@gmail.com" }]
keywords = ["KAP", "kamuyu-aydinlatma", "disclosure", "bildirim", "BIST", "fon", "turkey", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/semudu/kap-client"
Repository = "https://github.com/semudu/kap-client"
"Bug Tracker" = "https://github.com/semudu/kap-client/issues"
Changelog = "https://github.com/semudu/kap-client/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kap_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kap_client"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hatch-vcs>=0.5.0",
]
