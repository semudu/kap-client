name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── 1. CI: lint + tests (reuses ci.yml) ─────────────────────────────────
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  # ── 2. Build wheel + sdist (once, artifact shared below) ────────────────
  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history required for hatch-vcs tag detection
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install Hatch
        run: uv tool install hatch
      - name: Build wheel + sdist
        run: hatch build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 3a. Publish to PyPI (Trusted Publishing — no API token needed) ───────
  publish-pypi:
    name: Publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release          # configure Trusted Publisher under this env in repo settings
    permissions:
      id-token: write             # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── 3b. Create GitHub Release with auto-generated notes ──────────────────
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true  # auto-filled from merged PRs / commits
